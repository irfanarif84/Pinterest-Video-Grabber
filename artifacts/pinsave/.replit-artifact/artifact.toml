kind = "web"
previewPath = "/"
title = "PinSave – Pinterest Video Downloader"
version = "1.0.0"
id = "artifacts/pinsave"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23065

[services.development]
run = "pnpm --filter @workspace/pinsave run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/pinsave", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/pinsave/dist/server/index.mjs"]

[services.production.run.env]
PORT = "23065"
NODE_ENV = "production"

[services.env]
PORT = "23065"
BASE_PATH = "/"
